name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reproducible dependencies
        run: |
          python -m pip install --upgrade "pip==26.2"
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt \
            -c constraints.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run tests with branch coverage
        run: python -m pytest --cov=. --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=50

      - name: Print line and branch coverage totals
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(Path("coverage.json").read_text())["totals"]
          line_rate = 100 * totals["covered_lines"] / totals["num_statements"]
          branch_rate = 100 * totals["covered_branches"] / totals["num_branches"]
          print(f"Line coverage: {line_rate:.1f}%")
          print(f"Branch coverage: {branch_rate:.1f}%")
          PY

      - name: Upload machine-readable coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Run key pipeline in a temporary directory
        shell: bash
        run: |
          workspace="$PWD"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp synthetic_temperature_data.csv "$tmpdir/"
          cd "$tmpdir"
          python "$workspace/preprocessing.py"
          python "$workspace/train_model.py"
          python "$workspace/anomaly_detection.py"
          python "$workspace/evaluation.py" --output evaluation_report.json
          test -s preprocessed_temperature_data.csv
          test -s models/model_meta.json
          test -s temperature_anomaly_results.csv
          test -s alarm_log.csv
          test -s event_log.csv
          test -s evaluation_report.json